name: "OpenEval Quality Check"
description: "Run OpenEval evaluation quality gates in CI"

inputs:
  config:
    description: "Path to the OpenEval evaluation YAML file"
    required: false
    default: "examples/basic/evaluation.yaml"

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"
        check-latest: false

    - name: Install OpenEval
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install "${{ github.action_path }}/../../.."

    - name: Run OpenEval quality check
      shell: bash
      run: python -m openeval.interface.cli run "${{ inputs.config }}"