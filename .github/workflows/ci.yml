name: OpenEval CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          check-latest: false

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run Ruff
        run: ruff check .

      - name: Run Black
        run: black --check .

      - name: Run MyPy
        run: mypy openeval

      - name: Run Pytest
        run: pytest

      - name: Run OpenEval quality check
        uses: ./.github/actions/openeval
        with:
          config: examples/basic/evaluation.yaml

      - name: Upload OpenEval reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: openeval-reports
          path: reports/**