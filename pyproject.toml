[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openeval"
version = "0.1.0"
description = "CI/CD and Production Quality Platform for LLM Applications"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"

authors = [
    { name = "Harsh Rudrawar" }
]

dependencies = [
    "PyYAML>=6.0",
    "openai",
]

[project.urls]
Homepage = "https://github.com/Harshrudrawar/OpenEval"
Repository = "https://github.com/Harshrudrawar/OpenEval"

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "ruff>=0.6",
    "black>=24.0",
    "mypy>=1.11",
    "types-PyYAML",
    "pre-commit>=3.8",
]

[tool.setuptools.packages.find]
include = ["openeval*"]
exclude = ["reports*", "tests*", "docs*", "examples*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.black]
line-length = 88
target-version = ["py312"]